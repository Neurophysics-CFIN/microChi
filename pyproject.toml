[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mesochi"
version = "0.1.0"
description = "MesoChi: Microstructure Informed Quantitative Susceptibility Mapping, with simulation and ex vivo workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.5",
    "scipy==1.16.3",
    "matplotlib==3.10.7",
    "sigpy==0.1.27",
]

[project.optional-dependencies]
nifti = ["nibabel>=5.3,<6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mesochi*"]
namespaces = false

